plugins {
    id 'com.android.application'
}

// Credenciais do SMTP usado pelo "Fale conosco" ficam fora do Git:
// defina esplink.mail.user / esplink.mail.password em local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def quoted = { String key -> '"' + (localProps.getProperty(key, '') ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'fatima.tech.espnetsmart'
    compileSdk 36

    defaultConfig {
        applicationId 'fatima.tech.espnetsmart'
        minSdk 21
        //noinspection ExpiredTargetSdkVersion
        targetSdk 25
        versionCode 3
        versionName '1.1'

        buildConfigField 'String', 'MAIL_USER', quoted('esplink.mail.user')
        buildConfigField 'String', 'MAIL_PASSWORD', quoted('esplink.mail.password')
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
}

dependencies {
    def supportVersion = '25.3.1'
    implementation "com.android.support:appcompat-v7:$supportVersion"
    implementation "com.android.support:design:$supportVersion"
    implementation "com.android.support:support-v4:$supportVersion"
    implementation "com.android.support:support-v13:$supportVersion"
    implementation "com.android.support:cardview-v7:$supportVersion"
    implementation "com.android.support:recyclerview-v7:$supportVersion"
    implementation "com.android.support:percent:$supportVersion"

    implementation 'com.afollestad.material-dialogs:core:0.9.4.4'
    implementation 'com.afollestad.material-dialogs:commons:0.9.4.4'
    implementation 'org.java-websocket:Java-WebSocket:1.3.7'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    // cn.fanrunqi:waveprogress:1.0.1 não existe mais em repositório público (só havia no JCenter):
    // a única classe da biblioteca está em app/src/main/java/cn/fanrunqi/waveprogress.
}

// Lista os AARs resolvidos (usado para separar recursos do app dos recursos de bibliotecas).
tasks.register('listAars') {
    def files = configurations.named('debugRuntimeClasspath').map {
        it.incoming.artifactView { attributes { attribute(Attribute.of('artifactType', String), 'aar') } }.files
    }
    doLast { files.get().each { println "AAR " + it } }
}
